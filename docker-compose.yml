name: agentic-stock-analysis

services:
  agentic-stock-analysis:
    build:
      context: .
      args:
        CODEX_VERSION: "0.146.0"
    image: agentic-stock-analysis-codex:latest
    env_file:
      - path: .env
    environment:
      ML_BASE_URL: ${ML_BASE_URL:-http://ml-api:8000}
      ORGANIZER_BASE_URL: ${ORGANIZER_BASE_URL:-http://organizer-api:8000}
      MINIMUM_SCORE: ${MINIMUM_SCORE:-0.5}
      DETAILED_ANALYSIS_RESULT: ${DETAILED_ANALYSIS_RESULT:-detailedAnalysisResults}
      ENTRY_STRATEGY_RESULT: ${ENTRY_STRATEGY_RESULT:-entryStrategyResults}
      HOLD_STRATEGY_RESULT: ${HOLD_STRATEGY_RESULT:-holdStrategyResults}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./detailedAnalysisResults:/app/detailedAnalysisResults
      - ./entryStrategyResults:/app/entryStrategyResults
      - ./holdStrategyResults:/app/holdStrategyResults
      - codex-home:/root/.codex
      - ${HOME}/.codex:/host-codex:ro
    networks:
      - stock-backend
  initialize-fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: agentic-stock-analysis-api:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8003}:8000"
    volumes:
      - ./detailedAnalysisResults:/app/detailedAnalysisResults:ro
      - ./entryStrategyResults:/app/entryStrategyResults:ro
      - ./holdStrategyResults:/app/holdStrategyResults:ro
    networks:
      stock-backend:
        aliases:
          - agentic-api
    restart: unless-stopped
  initialize-fastapi-mcp:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: agentic-stock-analysis-api:latest
    command: ["uvicorn", "app.mcp_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${MCP_PORT:-8004}:8000"
    volumes:
      - ./detailedAnalysisResults:/app/detailedAnalysisResults:ro
    networks:
      stock-backend:
        aliases:
          - agentic-mcp
    restart: unless-stopped
  chat-api:
    build:
      context: .
      dockerfile: Dockerfile.chat
      args:
        CODEX_VERSION: "0.146.0"
    image: agentic-stock-analysis-chat-api:latest
    env_file:
      - path: .env
    environment:
      ORGANIZER_BASE_URL: ${ORGANIZER_BASE_URL:-http://organizer-api:8000}
      CHAT_MCP_URL: ${CHAT_MCP_URL:-http://agentic-mcp:8000/mcp}
      CHAT_CODEX_TIMEOUT_SECONDS: ${CHAT_CODEX_TIMEOUT_SECONDS:-120}
      CHAT_ORGANIZER_TIMEOUT_SECONDS: ${CHAT_ORGANIZER_TIMEOUT_SECONDS:-5}
      CHAT_MAX_CONCURRENCY: ${CHAT_MAX_CONCURRENCY:-2}
      CHAT_MAX_MESSAGE_CHARS: ${CHAT_MAX_MESSAGE_CHARS:-10000}
      CHAT_MAX_RESPONSE_BYTES: ${CHAT_MAX_RESPONSE_BYTES:-1000000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["uvicorn", "app.chat_main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - initialize-fastapi-mcp
    ports:
      - "127.0.0.1:${CHAT_API_PORT:-8005}:8000"
    volumes:
      - chat-codex-home:/home/chatuser/.codex
      - ${HOME}/.codex:/host-codex:ro
    networks:
      stock-backend:
        aliases:
          - agentic-chat-api
    read_only: true
    tmpfs:
      - /tmp:size=64m
    restart: unless-stopped

volumes:
  codex-home:
  chat-codex-home:

networks:
  stock-backend:
    external: true
    name: stock-analysis-backend
