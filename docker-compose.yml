name: agentic-stock-analysis

services:
  agentic-stock-analysis:
    build:
      context: .
      args:
        CODEX_VERSION: "0.146.0"
    image: agentic-stock-analysis-codex:latest
    env_file:
      - path: .env
    environment:
      ML_BASE_URL: ${ML_BASE_URL:-}
      ORGANIZER_BASE_URL: ${ORGANIZER_BASE_URL:-http://host.docker.internal:8001}
      MINIMUM_SCORE: ${MINIMUM_SCORE:-0.5}
      DETAILED_ANALYSIS_RESULT: ${DETAILED_ANALYSIS_RESULT:-detailedAnalysisResults}
      ENTRY_STRATEGY_RESULT: ${ENTRY_STRATEGY_RESULT:-entryStrategyResults}
      HOLD_STRATEGY_RESULT: ${HOLD_STRATEGY_RESULT:-holdStrategyResults}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./detailedAnalysisResults:/app/detailedAnalysisResults
      - ./entryStrategyResults:/app/entryStrategyResults
      - ./holdStrategyResults:/app/holdStrategyResults
      - ./data:/app/data:ro
      - codex-home:/root/.codex
      - ${HOME}/.codex:/host-codex:ro
  initialize-fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: agentic-stock-analysis-api:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8003}:8000"
    volumes:
      - ./detailedAnalysisResults:/app/detailedAnalysisResults:ro
      - ./entryStrategyResults:/app/entryStrategyResults:ro
      - ./holdStrategyResults:/app/holdStrategyResults:ro
    restart: unless-stopped
  initialize-fastapi-mcp:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: agentic-stock-analysis-api:latest
    command: ["uvicorn", "app.mcp_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${MCP_PORT:-8004}:8000"
    volumes:
      - ./detailedAnalysisResults:/app/detailedAnalysisResults:ro
      - ./data:/app/data
    restart: unless-stopped

volumes:
  codex-home:
