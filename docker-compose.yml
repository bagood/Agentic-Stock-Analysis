name: agentic-stock-analysis

services:
  agentic-stock-analysis:
    build:
      context: .
      args:
        CODEX_VERSION: "0.146.0"
    image: agentic-stock-analysis-codex:latest
    ports:
      - "127.0.0.1:${API_PORT:-8003}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BASE_URL: ${BASE_URL:-}
      MINIMUM_SCORE: ${MINIMUM_SCORE:-0.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./analysisResults:/app/analysisResults
      - ./data:/app/data:ro
      - codex-home:/root/.codex
      - ${HOME}/.codex:/host-codex:ro
    command: ["python", "run_detailed_analysis.py", "--forecast-window", "10-20"]
  initialize-fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: agentic-stock-analysis-api:latest
    ports:
      - "127.0.0.1:${API_PORT:-8003}:8000"
    volumes:
      - ./analysisResults:/app/analysisResults:ro
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/analysis', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  codex-home:
